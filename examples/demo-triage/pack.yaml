spec: 0
id: demo-triage
version: 0.1.0
license: CC0-1.0
tested: null
description: >-
  Minimal example pack: first-line triage of an inbound support message —
  refund intent, owning queue, urgency. Non-goals: drafting replies, sentiment
  analysis, spam filtering.
state:
  description: One inbound customer support message as received.
  fields: [message]
questions:
  refund_request:
    type: noul
    instructions: "Does the message explicitly ask for a refund, return, or money back?"
  queue:
    type: choice
    instructions: "Which team should handle this message?"
    options:
      billing: "Payments, invoices, charges, refunds or plan changes."
      technical: "Product errors, crashes, outages, integrations or configuration."
      other: "Docs questions, praise, or anything else."
      unknown: "Cannot tell from the message."
  urgency:
    type: score
    instructions: "How soon does this message need a human response, considering stated impact and time pressure?"
    levels: [low, normal, high, unknown]
    level_descriptions:
      low: "No stated impact or time pressure; can wait indefinitely."
      normal: "A normal request; a response within a few days is fine."
      high: "Stated impact or time pressure; needs a response today."
      unknown: "Cannot tell from the message."
thresholds:
  refund_request: {true: 0.8, false: 0.8}
  queue: {billing: 0.6, technical: 0.6, other: 0.6}
  urgency: {low: 0.7, normal: 0.7, high: 0.7}
